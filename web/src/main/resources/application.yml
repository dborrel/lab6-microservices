spring:
  application:
    # Service name for Eureka registration and Config Server lookup.
    # This service will be registered as "WEB-SERVICE" in Eureka.
    name: web-service
  cloud:
    config:
      # Direct URL to Config Server.
      uri: http://localhost:8762
  config:
    # Fetches configuration from Config Server.
    # WITHOUT "optional:" prefix = FAIL-FAST behavior (service fails if Config Server unreachable)
    # WITH "optional:" prefix = service starts anyway using local config
    # Note: spring.cloud.config.fail-fast is IGNORED when using spring.config.import
    import: "configserver:"

# Notice there's no explicit Eureka client configuration here!
# Spring Cloud automatically configures Eureka client when:
# 1. spring-cloud-starter-netflix-eureka-client is on the classpath
# 2. Eureka is available at the default location (http://localhost:8761/eureka/)
# The web service will automatically register with Eureka and discover other services.

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException
    instances:
      accountsService:
        base-config: default
  
  # Configuración de Retry
  retry:
    configs:
      default:
        max-attempts: 3 # Número máximo de intentos (incluyendo el intento inicial)
        wait-duration: 1s # Tiempo de espera entre reintentos
        enable-exponential-backoff: true # Activa backoff exponencial
        exponential-backoff-multiplier: 2 # Multiplica el wait-duration por 2 en cada reintento
        enable-random-wait: true # Activa jitter (añade aleatoriedad al tiempo de espera)
        random-wait-factor: 0.5 # Factor de aleatoriedad (0.5 = ±50% del wait-duration)
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      accountsService:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      accountsService:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
    defaults:
      enabled: true
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
